name: CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: '1.24.12'
  # Match the native library to the Go binding revision in go.mod.
  WHISPER_CPP_REV: f53dc74843e97f19f94a79241357f74ad5b691a6

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download dependencies
        run: go mod download

      - name: Run tests (no cgo)
        run: |
          # Run tests for packages that don't require whisper.cpp
          # Note: -race flag requires CGO, so it's omitted when CGO_ENABLED=0
          CGO_ENABLED=0 go test -v -coverprofile=coverage.out ./internal/config/... ./internal/batch/... ./internal/device/... ./internal/models/... ./internal/version/... ./internal/logging/... ./internal/decode/... ./internal/vad/...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          skip-pkg-cache: true
        continue-on-error: true

      - name: Run gofmt
        run: |
          output=$(gofmt -l cmd internal)
          if [ -n "$output" ]; then
            echo "The following files are not formatted:"
            echo "$output"
            exit 1
          fi

      - name: Run go vet (syntax check only)
        run: |
          # Check Go syntax without cgo (whisper.cpp headers not available)
          for pkg in ./internal/config ./internal/batch ./internal/device ./internal/models ./internal/version ./internal/logging; do
            CGO_ENABLED=0 go vet "$pkg/..."
          done

  build-test:
    name: Build Test (with whisper.cpp)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential cmake

      - name: Clone and build whisper.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git $HOME/whisper.cpp
          cd $HOME/whisper.cpp
          git fetch --depth 1 origin "$WHISPER_CPP_REV"
          git checkout --detach FETCH_HEAD
          mkdir build && cd build
          cmake .. -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=OFF
          cmake --build . --config Release -j$(nproc)

      - name: Test and build OpenCaption
        run: |
          export WHISPER_CPP=$HOME/whisper.cpp
          export CGO_CFLAGS="-I$WHISPER_CPP/include -I$WHISPER_CPP/ggml/include"
          export CGO_LDFLAGS="-L$WHISPER_CPP/build/src -L$WHISPER_CPP/build/ggml/src"
          export LD_LIBRARY_PATH="$WHISPER_CPP/build/src:$WHISPER_CPP/build/ggml/src:${LD_LIBRARY_PATH:-}"
          go test -race ./...
          go vet ./...
          go build -ldflags="-X opencaption/internal/version.Version=$(git describe --tags --always --dirty) -X opencaption/internal/version.Commit=$(git rev-parse --short HEAD) -X opencaption/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o opencaption ./cmd/opencaption

      - name: Verify binary
        run: |
          ls -la opencaption
          file opencaption
          LD_LIBRARY_PATH="$HOME/whisper.cpp/build/src:$HOME/whisper.cpp/build/ggml/src:${LD_LIBRARY_PATH:-}" ./opencaption -version

  release:
    name: Release
    needs: [test, lint, build-test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential cmake

      - name: Clone and build whisper.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git $HOME/whisper.cpp
          cd $HOME/whisper.cpp
          git fetch --depth 1 origin "$WHISPER_CPP_REV"
          git checkout --detach FETCH_HEAD
          mkdir build && cd build
          cmake .. -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=OFF
          cmake --build . --config Release -j$(nproc)

      - name: Build release binary
        run: |
          export WHISPER_CPP=$HOME/whisper.cpp
          export CGO_CFLAGS="-I$WHISPER_CPP/include -I$WHISPER_CPP/ggml/include"
          export CGO_LDFLAGS="-L$WHISPER_CPP/build/src -L$WHISPER_CPP/build/ggml/src -Wl,-rpath,\$ORIGIN/lib"
          export VERSION=${GITHUB_REF#refs/tags/}
          go build -ldflags="-s -w -X opencaption/internal/version.Version=$VERSION -X opencaption/internal/version.Commit=$(git rev-parse --short HEAD) -X opencaption/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o opencaption ./cmd/opencaption

      - name: Package release
        run: |
          mkdir -p release/lib
          cp opencaption release/
          cp $HOME/whisper.cpp/build/src/libwhisper.so* release/lib/
          cp $HOME/whisper.cpp/build/ggml/src/libggml*.so* release/lib/
          cp README.md LICENSE release/
          cd release && tar -czf ../opencaption-linux-amd64.tar.gz *

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: opencaption-linux-amd64.tar.gz
          generate_release_notes: true
